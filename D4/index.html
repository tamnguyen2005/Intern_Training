<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
  </head>
  <body>
    <div class="task-input-container">
      <input id="task-input" type="text" placeholder="Enter your task..." />
      <button id="task-btn">Add</button>
    </div>
    <p id="task-count"></p>
    <div id="type-container" style="display: flex">
      <button class="task-type" data-value="all">All</button>
      <button class="task-type" data-value="active">Active</button>
      <button class="task-type" data-value="completed">Completed</button>
    </div>
    <ul id="task-list"></ul>
    <script type="module" src="ui.js"></script>
  </body>
</html>
